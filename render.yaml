services:
  - type: web
    name: codebase-explainer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Set this in the Render dashboard, not here.
      - key: OPENAI_API_KEY
        sync: false
